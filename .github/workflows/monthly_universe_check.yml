# .github/workflows/monthly_universe_check.yml — 매월 1일 종목 유니버스 점검(가격예측.종목_월간갱신 --dry-run).
# 결과(진입·이탈·보류 후보, 게이팅 통과 여부)는 실행 로그에만 남는다. 의존성은 requirements-ci.txt, 시크릿은 NEON_DB_URL만.
# ⚠️ --apply는 넣지 않는다 — constants.py 반영은 사람이 로그를 보고 로컬에서 실행한다.
# ⚠️ --dry-run도 후보 종목 주가를 Neon daily_stock_prices에 적재한다 — 그래서 job을 비활성(if: false)으로 두었다.
# 배경: .github/결정기록.md

name: 종목 유니버스 점검 (dry-run)

on:
  schedule:
    # UTC 02:00, 매월 1일 = KST 11:00(낮 시간대)
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    # 예약·수동 실행 모두 비활성. --dry-run의 DB 적재를 고친 뒤 이 줄을 지운다.
    if: ${{ false }}
    runs-on: ubuntu-latest
    # 실측 2.7~3.1분의 약 5배(신규 후보가 많으면 초기적재로 길어진다)
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치 (CI 전용 최소 세트)
        run: pip install -r requirements-ci.txt

      - name: 종목 유니버스 점검 (--dry-run, --apply 절대 넣지 않음)
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: python -m 가격예측.종목_월간갱신 --dry-run
