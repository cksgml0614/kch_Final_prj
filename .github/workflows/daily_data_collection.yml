# .github/workflows/daily_data_collection.yml — 매일 주가 → 거시지표를 수집해 Neon DB에 쓴다(주가데이터.주가_일일수집,
# 시장지표.지표_일일수집). 학습·예측은 하지 않는다(로컬 daily_pipeline.bat). 의존성은 requirements-ci.txt(이유는 그 파일 머리 주석).
# ⚠️ 저장소의 constants.py(종목 목록)를 체크아웃해 쓴다 — 월간 갱신 --apply 뒤 push하지 않으면 옛 종목 목록으로 조용히 돈다.
# ⚠️ 수동 Re-run은 확정 컷오프(19:40 KST) 이후에만 한다 — 장중 재실행은 당일분을 받지 못한다.
# 배경: .github/결정기록.md

name: 일일 시세/거시지표 수집

on:
  schedule:
    # UTC 10:54 = KST 19:54. 확정 컷오프(19:40 KST) 뒤여야 당일분을 받는다. 실제 시작은 GitHub 지연으로 수 시간 늦을 수 있다.
    - cron: "54 10 * * *"
  workflow_dispatch: {}

# 저장소에 쓰지 않는다.
permissions:
  contents: read

# 수동 실행과 예약 실행이 겹쳐도 DB에 동시에 쓰지 않게 직렬화한다(진행 중인 실행은 취소하지 않음).
concurrency:
  group: daily-data-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 실측 소요 5.0~9.6분의 약 3배
    timeout-minutes: 30
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치 (CI 전용 최소 세트)
        run: pip install -r requirements-ci.txt

      # 시크릿은 필요한 단계에만 붙인다(주가는 NEON_DB_URL만, 지표는 NEON_DB_URL + ECOS_API_KEY).
      - name: 주가 일일수집
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
        run: python -m 주가데이터.주가_일일수집

      # 주가 수집이 실패해도 지표 수집은 돈다. 앞 단계가 실패했으면 job은 그대로 실패로 끝난다.
      - name: 지표 일일수집
        if: ${{ !cancelled() }}
        env:
          NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python -m 시장지표.지표_일일수집
